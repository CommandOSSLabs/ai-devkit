name: Frontend CI

# Validates the skills landing page whenever the data it reads (skills/**)
# or the app itself changes. This is validation only — no deploy step.
# See deploy-frontend.yml and .github/workflows/README.md for the deploy leg.

on:
  pull_request:
    paths:
      - "skills/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
